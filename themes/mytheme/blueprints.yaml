name: 'My Theme'
version: 1.1.0
description: 'Customizing Quark 2 Open Publishing or Quark Open Publishing'
icon: crosshairs
author:
  name: 'Paul Hibbitts'
  email: paul@hibbittsdesign.org
  url: 'http://hibbittsdesign.org'
compatibility:
  grav: ['1.7', '2.0']

# The settings come from the parent theme that's installed: Quark 2 Open Publishing (Grav 2 package)
# or Quark Open Publishing (Grav 1.7 package)
extends@:
  - type: quark2-open-publishing/blueprints
    context: 'themes://'
  - type: quark-open-publishing/blueprints
    context: 'themes://'
